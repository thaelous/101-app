<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1626"/>
      <stop offset="100%" stop-color="#050b14"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#a855f7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#a855f7" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Glowing Emblem Circle -->
  <circle cx="256" cy="256" r="180" fill="url(#purpleGrad)" opacity="0.15"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#a855f7" stroke-width="3" stroke-dasharray="12 8" opacity="0.4"/>

  <!-- Stylized Book with 101 BMC Motif -->
  <g filter="url(#shadow)" transform="translate(256, 240)">
    <!-- Book Back / Cover -->
    <path d="M -150 -100 Q -10 -130 0 -90 Q 10 -130 150 -100 L 150 110 Q 10 80 0 120 Q -10 80 -150 110 Z" fill="#1e1b4b" stroke="#7c3aed" stroke-width="4"/>

    <!-- Left Page (Gold) -->
    <path d="M -140 -90 Q -10 -120 0 -85 L 0 105 Q -10 70 -140 100 Z" fill="url(#goldGrad)"/>
    <!-- Right Page (Gold) -->
    <path d="M 0 -85 Q 10 -120 140 -90 L 140 100 Q 10 70 0 105 Z" fill="url(#goldGrad)"/>

    <!-- Center Bookmark Ribbon -->
    <path d="M -12 -90 L 12 -90 L 12 125 L 0 110 L -12 125 Z" fill="#10b981"/>

    <!-- Subtle Page Lines -->
    <line x1="-120" y1="-50" x2="-25" y2="-55" stroke="#78350f" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="-120" y1="-20" x2="-25" y2="-25" stroke="#78350f" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="-120" y1="10" x2="-25" y2="5" stroke="#78350f" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="-120" y1="40" x2="-40" y2="35" stroke="#78350f" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <line x1="25" y1="-55" x2="120" y2="-50" stroke="#78350f" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="25" y1="-25" x2="120" y2="-20" stroke="#78350f" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="25" y1="5" x2="120" y2="10" stroke="#78350f" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="40" y1="35" x2="120" y2="40" stroke="#78350f" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Title Badge text: 101 BMC -->
  <rect x="136" y="380" width="240" height="52" rx="26" fill="#0b1626" stroke="#fbbf24" stroke-width="3"/>
  <text x="256" y="415" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="900" fill="#fbbf24" text-anchor="middle" letter-spacing="4">101 BMC</text>
</svg>
